name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run pytest
        env:
          PYTHONPATH: .
        run: |
          python -m pytest backend/tests -v

  frontend-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run vitest tests
        run: npm test

      - name: Build frontend
        run: npm run build

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Backend Docker Image
        run: docker build -f backend/Dockerfile -t experiment-hub-backend:ci .

      - name: Build Frontend Docker Image
        run: docker build -f frontend/Dockerfile -t experiment-hub-frontend:ci ./frontend

      - name: Smoke test backend container
        run: |
          docker run -d --name backend-smoke -e ENVIRONMENT=development -e DEMO_MODE=true experiment-hub-backend:ci
          for i in $(seq 1 30); do
            if docker exec backend-smoke python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz')"; then break; fi
            sleep 2
          done
          docker exec backend-smoke python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz')"
      - name: Smoke test frontend container
        run: |
          docker run -d --name frontend-smoke --link backend-smoke:backend experiment-hub-frontend:ci
          sleep 3
          docker exec frontend-smoke wget -qO- http://127.0.0.1:8080/
      - name: Container diagnostics and cleanup
        if: always()
        run: |
          docker logs backend-smoke || true
          docker logs frontend-smoke || true
          docker rm -f backend-smoke frontend-smoke || true
