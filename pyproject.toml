[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "experiment-comparison-hub-ryan-vo"
version = "1.4.0"
description = "Track ML experiment runs, hyperparameters and artifacts, calculate Pareto frontiers and compare metrics across seeds."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "Ryan Vo", email = "ryandtvo@gmail.com" }
]
keywords = [
    "machine-learning",
    "experiment-tracking",
    "pareto-frontier",
    "hypothesis-testing",
    "multi-objective-optimization",
    "ai-evaluation"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence"
]

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "sqlalchemy>=2.0.30",
    "httpx>=0.27.0",
    "pyjwt[crypto]>=2.9.0",
    "cryptography>=43.0.0",
    "python-multipart>=0.0.9",
    "scipy>=1.14.0",
    "numpy>=2.0.0"
]

[project.optional-dependencies]
test = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0"
]
